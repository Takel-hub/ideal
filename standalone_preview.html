            const [bookingState, setBookingState] = React.useState('none');
            const [bookingData, setBookingData] = React.useState({});
            const [isBackendOnline, setIsBackendOnline] = React.useState(false);
            const messagesEndRef = React.useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            React.useEffect(() => {
                scrollToBottom();
            }, [messages, isTyping]);

            // Check Backend Status on Mount
            React.useEffect(() => {
                const checkStatus = async () => {
                    try {
                        const res = await fetch('http://localhost:3001/');
                        if (res.ok) {
                            setIsBackendOnline(true);
                            console.log("✅ Backend is ONLINE");
                        } else {
                            setIsBackendOnline(false);
                            console.warn("⚠️ Backend is reachable but returned error");
                        }
                    } catch (err) {
                        setIsBackendOnline(false);
                        console.warn("❌ Backend is OFFLINE (using simulation)");
                    }
                };
                checkStatus();
                // Poll every 10 seconds
                const interval = setInterval(checkStatus, 10000);
                return () => clearInterval(interval);
            }, []);

            const handleSend = () => {
                if (!inputValue.trim()) return;
                handleInteraction(inputValue);
                setInputValue('');
            };

            const handleChoice = (choice) => {
                handleInteraction(choice);
            };

            const handleInteraction = async (input) => {
                // Add user message
                const userMsg = { id: Date.now(), sender: 'user', text: input };
                setMessages(prev => [...prev, userMsg]);
                setIsTyping(true);

                // Helper for Backend Calls
                const callApi = async (endpoint, method = 'GET', body = null) => {
                    console.log(`📡 Calling Backend: ${endpoint}`);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

                    try {
                        const res = await fetch(`http://localhost:3001/api${endpoint}`, {
                            method,
                            headers: { 'Content-Type': 'application/json' },
                            body: body ? JSON.stringify(body) : null,
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);

                        if (!res.ok) throw new Error('Server error');
                        const data = await res.json();
                        console.log("✅ Backend Response:", data);
                        return data;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            console.warn(`⚠️ Backend Call Timed Out (${endpoint})`);
                        } else {
                            console.warn(`⚠️ Backend Call Failed (${endpoint}):`, err);
                        }
                        return null; // Signal fallback
                    }
                };

                // Simulate typing delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                let botResponse = { id: Date.now() + 1, sender: 'bot', text: '', choices: [] };

                try {
                    // --- GLOBAL INTERCEPTOR (Always active) ---
                    const lowerInput = input.toLowerCase();
                    if (input === 'Ja, boka hembesök' || lowerInput.includes('boka rådgivning') || lowerInput === 'boka') {
                        botResponse.text = 'Härligt! Jag kollar Hans kalender... Vilken tid på dagen passar er bäst?';
                        botResponse.choices = ['Förmiddag', 'Eftermiddag', 'Kväll'];
                        setBookingState('time_slot');
                        setMessages(prev => [...prev, botResponse]);
                        return; // Stop further processing
                    }

                    if (input === 'Stäng chatt') {
                        setIsOpen(false);
                        setIsTyping(false);
                        return;
                    }

                    // --- Booking Flow Logic ---
                    if (bookingState !== 'none' && bookingState !== 'done') {

                        // 1. Handle "Visa fler tider" specifically
                        if (input === 'Visa fler tider') {
                            botResponse.text = "Inga problem! Här är några andra tider som Hans är ledig:";
                            botResponse.choices = ['Torsdag 09:00', 'Fredag 13:00', 'Måndag 16:00'];
                        }
                        else if (bookingState === 'time_slot') {
                            // TRY BACKEND CALENDAR
                            const calendarData = await callApi('/calendar/slots');

                            if (calendarData && calendarData.slots) {
                                const backendTimes = calendarData.slots.map(s => s.time);
                                botResponse.text = `Låt mig kolla i Hans kalender (Live)... 📅 \n\nJo, han är ledig följande tider:`;
                                botResponse.choices = [...backendTimes, 'Visa fler tider'];
                            } else {
                                // Fallback Simulation
                                let times = [];
                                let dateStr = "";
                                if (input === 'Förmiddag') {
                                    times = ['Tisdag 10:00', 'Onsdag 11:00'];
                                    dateStr = "kommande vecka";
                                } else if (input === 'Eftermiddag') {
                                    times = ['Tisdag 14:00', 'Onsdag 15:00'];
                                    dateStr = "kommande vecka";
                                } else {
                                    times = ['Tisdag 19:00', 'Onsdag 18:00']; // Kväll
                                    dateStr = "kommande vecka";
                                }
                                botResponse.text = `Låt mig kolla i Hans kalender... 📅 \n\nJo, han är ledig följande tider ${dateStr}:`;
                                botResponse.choices = [...times, 'Visa fler tider'];
                            }
                            setBookingState('specific_time');
                        }
                        else if (bookingState === 'specific_time') {
                            setBookingData({ ...bookingData, time: input });
                            botResponse.text = `Toppen! Jag har reserverat ${input}. För att Hans ska veta vem han besöker, vad är ditt för- och efternamn?`;
                            setBookingState('details_name');
                        }
                        else if (bookingState === 'details_name') {
                            // VALIDATION: Name
                            if (input.trim().split(' ').length < 2) {
                                botResponse.text = "Förlåt, jag behöver både för- och efternamn för bokningen. Försök igen! 🙂";
                            } else {
                                setBookingData({ ...bookingData, name: input });
                                botResponse.text = `Tack ${input}. Vilket telefonnummer kan Hans nå dig på?`;
                                setBookingState('details_phone');
                            }
                        }
                        else if (bookingState === 'details_phone') {
                            // VALIDATION: Swedish Phone
                            const phoneRegex = /^(\+46|0)[\d\s\-]{6,15}$/;
                            if (!phoneRegex.test(input.replace(/\s/g, ''))) {
                                botResponse.text = "Det verkar inte vara ett giltigt svenskt nummer. Vänligen ange ett nummer (t.ex. 070-123 45 67).";
                            } else {
                                setBookingData({ ...bookingData, phone: input });
                                botResponse.text = "Utmärkt. Vilken e-postadress ska vi skicka bokningsbekräftelsen till?";
                                setBookingState('details_email');
                            }
                        }
                        else if (bookingState === 'details_email') {
                            // VALIDATION: Email
                            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                            if (!emailRegex.test(input)) {
                                botResponse.text = "Det ser inte ut som en giltig e-postadress. Försök igen! 📧";
                            } else {
                                setBookingData({ ...bookingData, email: input });
                                botResponse.text = "Perfekt. Slutligen, vad är din adress (Gata, Gatunummer)?";
                                setBookingState('details_address_street');
                            }
                        }
                        else if (bookingState === 'details_address_street') {
                            setBookingData({ ...bookingData, street: input });
                            botResponse.text = "Tack. Vilket postnummer?";
                            setBookingState('details_address_zip');
                        }
                        else if (bookingState === 'details_address_zip') {
                            setBookingData({ ...bookingData, zip: input });
                            botResponse.text = "Och vilken ort?";
                            setBookingState('details_address_city');
                        }
                        else if (bookingState === 'details_address_city') {
                            const fullAddress = `${bookingData.street}, ${bookingData.zip} ${input}`;
                            setBookingData({ ...bookingData, city: input, fullAddress: fullAddress });

                            botResponse.text = `
                                Tack! Då har jag följande uppgifter:
                                
                                👤 ${bookingData.name}
                                📞 ${bookingData.phone}
                                📧 ${bookingData.email}
                                🏠 ${fullAddress}
                                📅 ${bookingData.time}
                                
                                Stämmer detta?
                            `;
                            botResponse.choices = ['Ja, boka nu', 'Ändra uppgifter'];
                            setBookingState('confirmation');
                        }
                        else if (bookingState === 'confirmation' && input === 'Ja, boka nu') {
                            // TRY BACKEND EMAIL
                            await callApi('/email/send', 'POST', {
                                to: bookingData.email,
                                subject: 'Bokningsbekräftelse - Takel.se',
                                body: `
                                    <h1>Tack för din bokning!</h1>
                                    <p>Här är detaljerna för ditt hembesök:</p>
                                    <ul>
                                        <li><strong>Namn:</strong> ${bookingData.name}</li>
                                        <li><strong>Tid:</strong> ${bookingData.time}</li>
                                        <li><strong>Adress:</strong> ${bookingData.fullAddress}</li>
                                        <li><strong>Telefon:</strong> ${bookingData.phone}</li>
                                        <li><strong>E-post:</strong> ${bookingData.email}</li>
                                    </ul>
                                    <p>Hans Nilsson kommer att kontakta dig innan besöket.</p>
                                `
                            });

                            // TRY BACKEND CALENDAR
                            await callApi('/calendar/book', 'POST', {
                                summary: `Hembesök: ${bookingData.name}`,
                                description: `Tel: ${bookingData.phone}\nAdress: ${bookingData.fullAddress}`,
                                startTime: new Date().toISOString() // In real app, parse bookingData.time
                            });

                            botResponse.text = "Fantastiskt! 🎉 Bokningen är bekräftad och jag har skickat ett mail till dig. Hans ser fram emot att träffas!";
                            botResponse.choices = ['Stäng chatt'];
                            setBookingState('done');
                        }
                    }
                    // --- General Conversation Logic ---
                    else {
                        // TRY BACKEND CHAT
                        const chatData = await callApi('/chat', 'POST', { message: input });

                        if (chatData && chatData.response) {
                            botResponse.text = chatData.response;
                            // Add generic choices if backend doesn't provide them
                            if (!botResponse.choices || botResponse.choices.length === 0) {
                                if (botResponse.text.toLowerCase().includes('boka')) {
                                    botResponse.choices = ['Ja, boka hembesök', 'Nej tack'];
                                } else {
                                    botResponse.choices = ['Boka rådgivning', 'Stäng chatt'];
                                }
                            }
                        } else {
                            // Fallback Simulation
                            const lowerInput = input.toLowerCase();

                            if (lowerInput.includes('spara') || input === 'Spara pengar') {
                                botResponse.text = 'Absolut! De flesta av våra kunder sparar 10-30 000 kr per år. Vill du att jag gör en snabb kalkyl för ditt tak?';
                                botResponse.choices = ['Ja, gärna!', 'Nej, bara nyfiken'];
                            } else if (lowerInput.includes('avdrag') || input === 'Teknikavdrag') {
                                botResponse.text = 'Grönt Teknikavdrag ger dig 50% avdrag för batterier/laddboxar och 15% för solceller. Avdraget görs direkt på fakturan. Vill du veta mer?';
                                botResponse.choices = ['Ja, räkna på det', 'Tillbaka'];
                            } else if (lowerInput.includes('boka') || input === 'Boka rådgivning') {
                                botResponse.text = 'Klart vi ska prata! Jag kan boka in ett kostnadsfritt hembesök där vi tittar på ert tak. Vilken tid på dagen passar er bäst?';
                                botResponse.choices = ['Förmiddag', 'Eftermiddag', 'Kväll'];
                                setBookingState('time_slot');
                            } else if (input === 'Ja, gärna!' || input === 'Ja, räkna på det') {
                                botResponse.text = 'Härligt! Vad har du för typ av tak på din villa?';
                                botResponse.choices = ['Tegel', 'Plåt', 'Papp/Annat'];
                            } else if (['Tegel', 'Plåt', 'Papp/Annat'].includes(input)) {
                                botResponse.text = 'Tack! Jag sätter gärna ihop en offert. Vill du att Hans kommer ut på ett hembesök för en exakt beräkning?';
                                botResponse.choices = ['Ja, boka hembesök', 'Nej, maila mig'];
                            } else if (input === 'Ja, ring mig') {
                                botResponse.text = 'Vad bra! Vilket nummer når vi dig på?';
                                setBookingState('details_phone');
                            } else if (input.includes('Jag vill boka')) {
                                botResponse.text = `Utmärkt val! Tänk på att paketen enbart är förslag.Jag rekommenderar att vi kommer ut och tittar på ert tak för att skräddarsy lösningen.Ska vi boka ett hembesök ? `;
                                botResponse.choices = ['Ja, boka hembesök', 'Nej, bara pris'];
                            } else {
                                botResponse.text = 'Intressant fråga! Det där är något Hans gärna svarar på vid ett hembesök. Vill du boka en kostnadsfri rådgivning?';
                                botResponse.choices = ['Ja, boka hembesök', 'Nej tack'];
                            }
                        }
                    }

                    setMessages(prev => [...prev, botResponse]);
                } catch (error) {
                    console.error("Error in handleInteraction:", error);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <>
                    {/* Floating Toggle Button */}
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="fixed bottom-6 right-6 z-50 bg-orange-600 hover:bg-orange-700 text-white p-4 rounded-full shadow-2xl transition-transform hover:scale-110 flex items-center gap-2"
                    >
                        {isOpen ? <Icon name="X" className="w-8 h-8" /> : <Icon name="MessageCircle" className="w-8 h-8" />}
                        {!isOpen && <span className="font-bold text-lg pr-2">Fråga oss!</span>}
                    </button>

                    {/* Chat Window */}
                    {isOpen && (
                        <div className="fixed bottom-24 right-6 z-50 w-96 max-w-[90vw] bg-white rounded-2xl shadow-2xl border border-orange-100 flex flex-col overflow-hidden animate-in slide-in-from-bottom-10 fade-in duration-300 h-[600px] max-h-[80vh]">
                            {/* Header */}
                            <div className="bg-orange-600 p-4 flex items-center gap-3 shrink-0">
                                <div className="bg-white/20 p-2 rounded-full">
                                    <Icon name="Bot" className="w-6 h-6 text-white" />
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-white font-bold text-xl">Takel Assistent</h3>
                                    <div className="flex items-center gap-2">
                                        <div className={`w - 2 h - 2 rounded - full ${isBackendOnline ? 'bg-green-400' : 'bg-red-400'} animate - pulse`}></div>
                                        <p className="text-orange-100 text-sm">{isBackendOnline ? 'Online (AI)' : 'Simulering'}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Messages Area */}
                            <div className="flex-1 p-4 overflow-y-auto bg-gray-50 space-y-4">
                                {messages.map((msg) => (
                                    <div key={msg.id} className={`flex flex - col ${msg.sender === 'user' ? 'items-end' : 'items-start'} `}>
                                        <div className={`p - 4 rounded - 2xl max - w - [85 %] text - lg leading - relaxed shadow - sm whitespace - pre - wrap ${msg.sender === 'user'
                                            ? 'bg-orange-600 text-white rounded-tr-none'
                                            : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none'
                                            } `}>
                                            {msg.text}
                                        </div>

                                        {/* Choices (only for bot messages) */}
                                        {msg.sender === 'bot' && msg.choices && (
                                            <div className="mt-3 flex flex-wrap gap-2">
                                                {msg.choices.map((choice, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleChoice(choice)}
                                                        className="bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-200 px-4 py-2 rounded-full text-base font-medium transition-colors"
                                                    >
                                                        {choice}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="flex items-center gap-1 p-4 bg-white rounded-2xl rounded-tl-none w-fit border border-gray-200">
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className="p-4 bg-white border-t border-gray-100 shrink-0">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                        placeholder="Skriv en fråga..."
                                        className="flex-1 p-3 rounded-xl border border-gray-200 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none text-base"
                                    />
                                    <button
                                        onClick={handleSend}
                                        className="bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-xl transition-colors"
                                    >
                                        <Icon name="ArrowRight" className="w-6 h-6" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

                            </p>
                            <h3 className="text-2xl font-bold text-gray-900 mt-8 mb-4">Så fungerar avdraget</h3>
                            <p>

                            <div className="bg-orange-50 p-6 rounded-xl border border-orange-100 my-6">

                                <ul className="space-y-2">
                                    <li>🔋 <strong>Batterier för lagring:</strong> 50% avdrag på arbete och material.</li>
                                    <li>🚗 <strong>Laddbox till elbil:</strong> 50% avdrag på arbete och material.</li>
                                    <li>☀️ <strong>Solceller:</strong> 15% avdrag på arbete och material.</li>

                            </div>

                            </p>

                    )
                },
                {
                    id: 3,
                    tag: "Kundberättelse",
                    title: "Dag och Eva i Täby valde Takel",
                    excerpt: "Vi ville ha en trygg leverantör som förstod våra behov. Takel hjälpte oss från start till mål och nu producerar vi vår egen el.",
                    date: "05 Nov 2024",
                    readTime: "3 min läsning",
                    content: (
                        <>

                            <p>
                                "Vi tog in offerter från fyra olika bolag," säger Eva. "Takel var inte billigast, men de var de enda som faktiskt kom ut och tittade på vårt tak innan de gav ett pris. De andra kollade bara på satellitbilder."

                            <p>

                                <p className="italic text-green-800">
                                    "Nu producerar vi mer än vi gör av med på sommaren och säljer överskottet. Det känns fantastiskt att vara självförsörjande."

            return (
                <section className="py-24 bg-gray-50">
                    <div className="max-w-7xl mx-auto px-6">

                            <h2 className="text-4xl font-bold mb-6 text-gray-900">Nyheter & Guider</h2>

                            article={selectedArticle}
                            onClose={() => setSelectedArticle(null)}
                        />
                    )}

            );
        };

        const App = () => {
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                {
                    id: 1,
                    sender: 'bot',
                    text: 'Hej! 👋 Jag är Takels AI-assistent. Vad funderar du på kring solceller idag?',
                    choices: ['Spara pengar', 'Teknikavdrag', 'Boka rådgivning']
                }
            ]);

            const handlePackageBooking = (packageName) => {
                setIsChatOpen(true);
                const userMsg = { id: Date.now(), sender: 'user', text: `Jag vill boka ${packageName} ` };
                setChatMessages(prev => [...prev, userMsg]);

                // Trigger bot response for this intent immediately (simulated)
                setTimeout(() => {
                    const botMsg = {
                        id: Date.now() + 1,
                        sender: 'bot',
                        text: `Utmärkt val! \n\nTänk dock på att ${packageName} (och våra andra paket) enbart är förslag.Varje hus är unikt. 🏠\n\nJag föreslår att vi kommer på ett kostnadsfritt hembesök för att skräddarsy den bästa lösningen för just er.Vad sägs om det ?`,
                        choices: ['Ja, boka hembesök', 'Nej, jag vill bara veta pris']
                    };
                    setChatMessages(prev => [...prev, botMsg]);
                }, 1000);
            };

            return (
                <div className="min-h-screen bg-background font-sans text-text">
                    <Header />
                    <main>
                        <Hero />
                        <Stats />
                        <Features />
                        <Packages onBooking={handlePackageBooking} />
                        <NewsSection />
                        <ContactForm />
                    </main>
                    <Footer />
                    <ChatWidget
                        isOpen={isChatOpen}
                        setIsOpen={setIsChatOpen}
                        messages={chatMessages}
                        setMessages={setChatMessages}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
